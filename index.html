<body>
<div class="container">

  <div class="logo">BiGGER WIN</div>
  <p class="subtitle">Welcome to your winning journey</p>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">Login</button>
    <button id="signupTab" type="button">Sign Up</button>
  </div>

  <form id="authForm">
    <label for="email">Email Address</label>
    <input id="email" type="email"
      placeholder="Enter your email address"
      autocomplete="email" required>

    <div id="passwordArea">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" type="password"
          placeholder="Enter your password"
          autocomplete="current-password" required>
        <button class="show-btn" id="showPassword"
          type="button">Show</button>
      </div>
    </div>

    <a href="#" class="forgot" id="forgotPassword">
      Forgot password?
    </a>

    <button class="main-btn" id="submitBtn" type="submit">
      Login
    </button>
  </form>

  <div id="message" class="message hidden"
    role="status" aria-live="polite"></div>

  <div class="footer">
    © 2026 BiGGER WIN. All rights reserved.
  </div>

</div>

<script>
const SUPABASE_URL =https://kedrvewjsixadhrchvpu.supabase.co
const SUPABASE_KEY =https://esm.sh/@supabase/supabase-js@2
const clint
  SUPABASE_URL,

const form = document.getElementById("authForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const passwordArea = document.getElementById("passwordArea");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const forgotPassword = document.getElementById("forgotPassword");
const showPassword = document.getElementById("showPassword");

let mode = "login";

function showMessage(text) {
  message.textContent = text;
  message.classList.remove("hidden");
}

function setMode(newMode) {
  mode = newMode;
  message.classList.add("hidden");

  loginTab.classList.toggle("active", mode === "login");
  signupTab.classList.toggle("active", mode === "signup");

  submitBtn.textContent =
    mode === "login" ? "Login" : "Create Account";

  passwordInput.autocomplete =
    mode === "login" ? "current-password" : "new-password";
}

loginTab.addEventListener("click", () => setMode("login"));
signupTab.addEventListener("click", () => setMode("signup"));

showPassword.addEventListener("click", () => {
  const hidden = passwordInput.type === "password";
  passwordInput.type = hidden ? "text" : "password";
  showPassword.textContent = hidden ? "Hide" : "Show";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    showMessage("Please enter your email and password.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Please wait...";

  try {
    if (mode === "signup") {
      const { data, error } = await client.auth.signUp({
        email,
        password
      });

      if (error) throw error;

      showMessage(
        data.session
          ? "Account created successfully!"
          : "Account created. Check your email to confirm your account."
      );

    } else {
      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      showMessage("Login successful! Welcome to BiGGER WIN.");
    }

  } catch (error) {
    showMessage(error.message || "Something went wrong.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent =
      mode === "login" ? "Login" : "Create Account";
  }
});

forgotPassword.addEventListener("click", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();

  if (!email) {
    showMessage("Enter your email address first.");
    emailInput.focus();
    return;
  }

  showMessage("Sending password recovery email...");

  try {
    const { error } = await client.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: window.location.origin
      }
    );

    if (error) throw error;

    showMessage("Recovery email sent. Check your inbox.");

  } catch (error) {
    showMessage(error.message || "Could not send recovery email.");
  }
});
</script>
