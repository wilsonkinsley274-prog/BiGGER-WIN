
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>BiGGER WIN | Welcome</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      border-bottom: 1px solid #bd963d;
    }

    .logo {
      color: #e5bd54;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #ccc;
      margin-top: 10px;
      font-size: 14px;
    }

    main {
      width: 100%;
      max-width: 440px;
      margin: 65px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #e5bd54;
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #bbb;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .welcome-card {
      border: 1px solid #bd963d;
      border-radius: 15px;
      padding: 30px 20px;
      background: #121212;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #e5bd54;
      color: #080808;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: #e5bd54;
      border: 1px solid #e5bd54;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">BiGGER WIN</div>
    <div class="subtitle">
      Welcome to a world of opportunities
    </div>
  </header>

  <main>
    <div class="welcome-card">
      <h1>Welcome!</h1>

      <p>
        Discover games, rewards, creators
        and exciting opportunities with
        BiGGER WIN.
      </p>

      <button type="button">LOGIN</button>

      <button class="secondary" type="button">
        CREATE ACCOUNT
      </button>
    </div>
  </main>

  <footer>
    © 2026 BiGGER WIN. All rights reserved.
  </footer>

</body>
  </html>
