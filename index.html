
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiGGER WIN</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      color: #111;
      border-radius: 15px;
      text-align: center;
    }
    h1 { color: #c99a18; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border-radius: 7px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #c99a18;
      color: white;
      border: 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>BiGGER WIN</h1>
  <p>Play, Create and Win!</p>

  <h3>Create Account</h3>
  <input type="email" id="signup-email" placeholder="Email">
  <input type="password" id="signup-password" placeholder="Password">
  <button id="signup-btn">SIGN UP</button>

  <hr>

  <h3>Login</h3>
  <input type="email" id="login-email" placeholder="Email">
  <input type="password" id="login-password" placeholder="Password">
  <button id="login-btn">LOGIN</button>

  <p id="message"></p>
</div>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(https://kedrvewjsixadhrchvpu.supabase.co,sb_publishable_kY88vqNjvyYXQ6XjTRU9Bg_VVoOyqMq
);

document.getElementById('signup-btn').onclick = async () => {
  const { error } = await supabase.auth.signUp({
    email: document.getElementById('signup-email').value,
    password: document.getElementById('signup-password').value
  });
  document.getElementById('message').textContent =
    error ? error.message : 'Account created! Check your email.';
};

document.getElementById('login-btn').onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('login-email').value,
    password: document.getElementById('login-password').value
  });
  document.getElementById('message').textContent =
    error ? error.message : 'Login successful!';
};
</script>

</body>
  
</html>
