<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiGGER WIN - Welcome</title>

<style>
/* BiGGER WIN mobile display */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  color: #222222;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

input, button {
  max-width: 100%;
  font-size: 16px;
}

button {
  cursor: pointer;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  input, button {
    width: 100%;
    min-height: 48px;
  }
}
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff !important;
  color: #222222;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
  background: #ffffff;
  padding: 30px 24px;
  border: 1px solid #ead9a3;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.07);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: #c69b24;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666666;
  margin-bottom: 25px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}

.tabs button {
  flex: 1;
  padding: 13px;
  border: 1px solid #d4ad43;
  border-radius: 8px;
  background: #ffffff;
  color: #9b7415;
  font-weight: bold;
}

.tabs button.active {
  background: #c69b24;
  color: #ffffff;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
  color: #333333;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cccccc;
  border-radius: 8px;
  font-size: 16px;
  background: #ffffff;
  color: #222222;
  outline-color: #c69b24;
}

.password-wrap {
  display: flex;
  gap: 7px;
}

.password-wrap input {
  flex: 1;
  min-width: 50%;
.password-wrap button {
  padding: 0 12px;
  border: 1px solid #c69b24;
  background: #ffffff;
  color: #9b7415;
  border-radius: 8px;
}
.main-button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #c69b24;
  color: #ffffff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.main-button:disabled {
  opacity: 0.6;
}

.forgot {
  display: block;
  text-align: right;
  margin-top: 14px;
  color: #a17b19;
  cursor: pointer;
  text-decoration: underline;
  font-size: 14px;
}

#message {
  margin-top: 18px;
  text-align: center;
  line-height: 1.5;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.hidden {
  display: none;
}

.footer {
  text-align: center;
  color: #888888;
  font-size: 12px;
  margin-top: 25px;
}
  
function togglePassword() {
  const password = document.getElementById("bw-login-password");

  if (password) {
    password.type =
      password.type === "password" ? "text" : "password";
  }
  }
  
</style>
</head>

<body>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");
  const nameGroup = document.getElementById("nameGroup");
  const fullName = document.getElementById("fullName");
  const submitBtn = document.getElementById("submitBtn");
  const password = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");
  const forgotLink = document.getElementById("forgotLink");

  function setMode(mode) {
    const isSignup = mode === "signup";

    nameGroup.classList.toggle("hidden", !isSignup);
    fullName.required = isSignup;

    loginTab.classList.toggle("active", !isSignup);
    signupTab.classList.toggle("active", isSignup);

    submitBtn.textContent = isSignup ? "SIGN UP" : "LOGIN";

    forgotLink.style.display = isSignup ? "none" : "block";

    password.autocomplete = isSignup
      ? "new-password"
      : "current-password";
  }

  loginTab.addEventListener("click", function () {
    setMode("login");
  });

  signupTab.addEventListener("click", function () {
    setMode("signup");
  });

  togglePassword.addEventListener("click", function () {
    const showing = password.type === "text";

    password.type = showing ? "password" : "text";
    togglePassword.textContent = showing ? "Show" : "Hide";
  });

  setMode("login");
});
</script>
  
<div class="container">

  <div class="logo">BiGGER WIN</div>
  <div class="subtitle">Welcome to a world of opportunities</div>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">LOGIN</button>
    <button id="signupTab" type="button">SIGN UP</button>
  </div>

  <form id="authForm">

    <div id="nameGroup" class="hidden">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text"
        placeholder="Enter your full name"
        autocomplete="name">
    </div>

    <label for="email">Email Address</label>
    <input id="email" type="email"
      placeholder="Enter your email address"
      autocomplete="email" required>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" type="password"
        placeholder="Enter your password"
        autocomplete="current-password" required>
<button id="togglePassword" type="button">Show</button>
</div>
    <div id="forgotLink" class="forgot">
      Forgot Password?
    </div>

    <button id="submitBtn" class="main-button" type="submit">
      LOGIN
    </button>

  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="footer">
    © 2026 BiGGER WIN. All rights reserved
