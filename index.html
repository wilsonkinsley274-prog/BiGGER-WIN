
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiGGER WIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container {
  width:100%;
  max-width:430px;
  padding:30px 24px;
  border:1px solid #eee;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo {
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#c69a28;
  margin-bottom:10px;
}

.subtitle {
  text-align:center;
  color:#666;
  margin-bottom:28px;
  font-size:14px;
}

.tabs { display:flex; gap:10px; margin-bottom:24px; }

.tabs button {
  flex:1;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.tabs button.active { background:#c69a28; }

.field { margin-bottom:17px; }

label {
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input {
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

input:focus {
  outline:2px solid #c69a28;
  border-color:#c69a28;
}

.password-box { position:relative; }

.password-box input { padding-right:75px; }

.show-btn {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#b58b20;
  font-weight:bold;
  cursor:pointer;
}

.forgot { text-align:right; margin:4px 0 20px; }

.forgot button {
  border:0;
  background:none;
  color:#b58b20;
  font-weight:bold;
  cursor:pointer;
}

.main-btn {
  width:100%;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#c69a28;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.main-btn:disabled { opacity:.6; }

.hidden { display:none !important; }

#message {
  margin-top:18px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.footer {
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:25px;
}

#dashboard { text-align:center; }
#dashboard h2 { color:#c69a28; margin-bottom:15px; }
#dashboard p { margin-bottom:20px; overflow-wrap:anywhere; }
</style>
</head>

<body>
<div class="container">

<div class="logo">BiGGER WIN</div>
<div class="subtitle">Welcome to a world of opportunities</div>

<div id="authArea">

<div class="tabs">
<button id="loginTab" class="active" type="button">LOGIN</button>
<button id="signupTab" type="button">SIGN UP</button>
</div>

<form id="authForm">

<div class="field hidden" id="nameGroup">
<label for="fullName">Full Name</label>
<input id="fullName" type="text" placeholder="Enter your full name">
</div>

<div class="field">
<label for="email">Email Address</label>
<input id="email" type="email" placeholder="Enter your email" required>
</div>

<div class="field">
<label for="password">Password</label>
<div class="password-box">
<input id="password" type="password" placeholder="Enter password" minlength="6" required>
<button type="button" class="show-btn" id="showPassword">Show</button>
</div>
</div>

<div class="forgot" id="forgotArea">
<button type="button" id="forgotPassword">Forgot Password?</button>
</div>

<button type="submit" class="main-btn" id="submitBtn">LOGIN</button>

</form>

<!-- PASSWORD RESET FORM -->
<div id="resetArea" class="hidden">

  <h2>Reset Your Password</h2>

  <div class="field">
    <label for="newPassword">New Password</label>
    <input
      id="newPassword"
      type="password"
      placeholder="Enter new password"
      minlength="6"
      required
    >
  </div>

  <div class="field">
    <label for="confirmNewPassword">Confirm New Password</label>
    <input
      id="confirmNewPassword"
      type="password"
      placeholder="Confirm new password"
      minlength="6"
      required
    >
  </div>

  <button
    type="button"
    class="main-btn"
    id="updatePasswordBtn"
  >
    RESET PASSWORD
  </button>

</div>

</div>

<div id="dashboard" class="hidden">
<h2>Welcome to BiGGER WIN!</h2>
<p id="userEmail"></p>
<button id="logoutBtn" class="main-btn" type="button">LOG OUT</button>
</div>

<div id="message" role="status" aria-live="polite"></div>

<div class="footer">
Gaming • Creator Rewards • Community • AI
<br><br>
© 2026 BiGGER WIN
</div>

</div>

<script>
/* 1. SUPABASE CONNECTION */

const SUPABASE_URL =
"https://kedrvewjsixadhrchvpu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kY88vqNjvyYXQ6XjTRU9Bg_VVoOyqMq";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* 2. PAGE ELEMENTS */

const $ = id => document.getElementById(id);

const authForm = $("authForm");
const authArea = $("authArea");
const dashboard = $("dashboard");
const message = $("message");

let mode = "login";
let busy = false;

function notify(text) {
message.textContent = text;
}

/* 3. CHANGE AUTHENTICATION MODE */

function setMode(newMode) {
mode = newMode;

$("loginTab").classList.toggle("active", mode === "login");
$("signupTab").classList.toggle("active", mode === "signup");

$("nameGroup").classList.toggle("hidden", mode !== "signup");
$("forgotArea").classList.toggle("hidden", mode !== "login");

$("fullName").required = mode === "signup";

$("submitBtn").textContent =
mode === "login" ? "LOGIN" : "CREATE ACCOUNT";

$("password").type = "password";
$("showPassword").textContent = "Show";

notify("");
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));

/* 4. SHOW OR HIDE PASSWORD */

$("showPassword").addEventListener("click", function() {
const visible = $("password").type === "password";

$("password").type = visible ? "text" : "password";
this.textContent = visible ? "Hide" : "Show";
});

/* 5. DASHBOARD */

function showDashboard(user) {
authArea.classList.add("hidden");
dashboard.classList.remove("hidden");
$("userEmail").textContent = user.email || "";
notify("Successfully logged in!");
}

/* 6. LOGIN AND SIGNUP */

authForm.addEventListener("submit", async function(event) {
event.preventDefault();

if (busy) return;

busy = true;
$("submitBtn").disabled = true;
$("submitBtn").textContent = "PLEASE WAIT...";

try {
const userEmail = $("email").value.trim();
const userPassword = $("password").value;

if (mode === "signup") {

const fullName = $("fullName").value.trim();

if (!fullName) throw new Error("Enter your full name.");

const { data, error } = await supabaseClient.auth.signUp({
email: userEmail,
password: userPassword,
options: {
data: { full_name: fullName }
}
});

if (error) throw error;

if (data.session) {
showDashboard(data.user);
} else {
notify("Account created! Check your email to confirm your registration.");
}

} else {

const { data, error } = await supabaseClient.auth.signInWithPassword({
email: userEmail,
password: userPassword
});

if (error) throw error;

showDashboard(data.user);
}

} catch (error) {
notify(error.message);
} finally {
busy = false;
$("submitBtn").disabled = false;
$("submitBtn").textContent =
mode === "login" ? "LOGIN" : "CREATE ACCOUNT";
}
});

/* 7.  FORGOT PASSWORD */

$("forgotPassword").addEventListener("click", async function() {
  const userEmail = $("email").value.trim();

  if (!userEmail) {
    notify("Enter your email address first.");
    return;
  }

  this.disabled = true;
  notify("Sending recovery email...");

  try {
    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        userEmail,
        {
          redirectTo: window.location.origin + "/?reset=true"
        }
      );

    if (error) throw error;

    notify("Recovery email sent. Check your inbox.");

  } catch (error) {
    notify(error.message);
  } finally {
    this.disabled = false;
  }
});

/* PASSWORD RESET HANDLER */

const updatePasswordBtn = $("updatePasswordBtn");

if (updatePasswordBtn) {
  updatePasswordBtn.addEventListener("click", async function() {
    const newPassword = $("newPassword").value;
    const confirmPassword = $("confirmNewPassword").value;

    if (newPassword.length < 6) {
      notify("Password must be at least 6 characters.");
      return;
    }

    if (newPassword !== confirmPassword) {
      notify("Passwords do not match.");
      return;
    }

    this.disabled = true;
    notify("Updating your password...");

    try {
      const { error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error) throw error;

      notify("Password updated successfully. Please log in again.");

      await supabaseClient.auth.signOut();

      $("resetArea").classList.add("hidden");
      authArea.classList.remove("hidden");
      dashboard.classList.add("hidden");
      authForm.reset();
      setMode("login");

    } catch (error) {
      notify(error.message);
    } finally {
      this.disabled = false;
    }
  });
                                     }     
/* 8. LOGOUT */

$("logoutBtn").addEventListener("click", async function() {
const { error } = await supabaseClient.auth.signOut();

if (error) {
notify(error.message);
return;
}

dashboard.classList.add("hidden");
authArea.classList.remove("hidden");
authForm.reset();
setMode("login");

notify("You have logged out successfully.");
});

/* 9. RESTORE LOGIN SESSION */

async function restoreSession() {
try {
const { data, error } = await supabaseClient.auth.getSession();

if (error) throw error;

if (data.session) {
showDashboard(data.session.user);
}
} catch (error) {
notify(error.message);
}
}

restoreSession();

/* DETECT PASSWORD RECOVERY */

async function startApp() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    notify(error.message);
    return;
  }

  const isRecovery =
    window.location.search.includes("reset=true") ||
    window.location.hash.includes("type=recovery");

  if (isRecovery) {
    authArea.classList.remove("hidden");
    dashboard.classList.add("hidden");

    document.querySelector(".tabs").classList.add("hidden");
    authForm.classList.add("hidden");
    $("resetArea").classList.remove("hidden");

    return;
  }

  if (data.session) {
    showDashboard(data.session.user);
  }
}

startApp();
  

</script>
</body>
</html>
