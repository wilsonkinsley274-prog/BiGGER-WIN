
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiGGER WIN - Welcome</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff !important;
  color: #222222;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
  background: #ffffff;
  padding: 30px 24px;
  border: 1px solid #ead9a3;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.07);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: #c69b24;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666666;
  margin-bottom: 25px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}

.tabs button {
  flex: 1;
  padding: 13px;
  border: 1px solid #d4ad43;
  border-radius: 8px;
  background: #ffffff;
  color: #9b7415;
  font-weight: bold;
}

.tabs button.active {
  background: #c69b24;
  color: #ffffff;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
  color: #333333;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cccccc;
  border-radius: 8px;
  font-size: 16px;
  background: #ffffff;
  color: #222222;
  outline-color: #c69b24;
}

.password-wrap {
  display: flex;
  gap: 7px;
}

.password-wrap input {
  flex: 1;
  min-width: 0;
}

.password-wrap button {
  padding: 0 12px;
  border: 1px solid #c69b24;
  background: #ffffff;
  color: #9b7415;
  border-radius: 8px;
}

.main-button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #c69b24;
  color: #ffffff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.main-button:disabled {
  opacity: 0.6;
}

.forgot {
  display: block;
  text-align: right;
  margin-top: 14px;
  color: #a17b19;
  cursor: pointer;
  text-decoration: underline;
  font-size: 14px;
}

#message {
  margin-top: 18px;
  text-align: center;
  line-height: 1.5;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.hidden {
  display: none;
}

.footer {
  text-align: center;
  color: #888888;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">BiGGER WIN</div>
  <div class="subtitle">Welcome to a world of opportunities</div>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">LOGIN</button>
    <button id="signupTab" type="button">SIGN UP</button>
  </div>

  <form id="authForm">

    <div id="nameGroup" class="hidden">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text"
        placeholder="Enter your full name"
        autocomplete="name">
    </div>

    <label for="email">Email Address</label>
    <input id="email" type="email"
      placeholder="Enter your email address"
      autocomplete="email" required>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" type="password"
        placeholder="Enter your password"
        autocomplete="current-password" required>
      <button id="togglePassword" type="button">Show</button>
    </div>

    <div id="forgotLink" class="forgot">
      Forgot Password?
    </div>

    <button id="submitBtn" class="main-button" type="submit">
      LOGIN
    </button>

  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="footer">
    © 2026 BiGGER WIN. All rights reserved.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ENTER YOUR SUPABASE DETAILS HERE */

const SUPABASE_URL =https://kedrvewjsixadhrchvpu.supabase.co
const SUPABASE_KEY =sb_publishable_kY88vqNjvyYXQ6XjTRU9Bg_VVoOyqMq

/* CONNECT TO SUPABASE */

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* PAGE ELEMENTS */

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const nameGroup = document.getElementById("nameGroup");
const fullName = document.getElementById("fullName");
const email = document.getElementById("email");
const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const forgotLink = document.getElementById("forgotLink");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const authForm = document.getElementById("authForm");

let currentMode = "login";

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "#198754" : "#c0392b";
}

function setMode(mode) {
  currentMode = mode;
  message.textContent = "";

  const signup = mode === "signup";

  loginTab.classList.toggle("active", !signup);
  signupTab.classList.toggle("active", signup);

  nameGroup.classList.toggle("hidden", !signup);
  forgotLink.classList.toggle("hidden", signup);

  submitBtn.textContent = signup ? "CREATE ACCOUNT" : "LOGIN";
  password.autocomplete = signup ? "new-password" : "current-password";
}

loginTab.addEventListener("click", () => setMode("login"));
signupTab.addEventListener("click", () => setMode("signup"));

/* SHOW AND HIDE PASSWORD */

togglePassword.addEventListener("click", () => {
  const showing = password.type === "text";

  password.type = showing ? "password" : "text";
  togglePassword.textContent = showing ? "Show" : "Hide";
});

/* LOGIN AND SIGNUP */

authForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "";

  const userEmail = email.value.trim();
  const userPassword = password.value;

  if (!userEmail || !userPassword) {
    showMessage("Please enter your email and password.");
    return;
  }

  if (currentMode === "signup" && userPassword.length < 6) {
    showMessage("Password must contain at least 6 characters.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "PLEASE WAIT...";

  try {
    if (currentMode === "signup") {

      const { data, error } = await supabaseClient.auth.signUp({
        email: userEmail,
        password: userPassword,
        options: {
          data: {
            full_name: fullName.value.trim()
          },
          emailRedirectTo: window.location.origin
        }
      });

      if (error) throw error;

      if (data.session) {
        showMessage("Your account has been created successfully!", true);
      } else {
        showMessage(
          "Account created! Please check your email to confirm your account.",
          true
        );
      }

    } else {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: userEmail,
          password: userPassword
        });

      if (error) throw error;

      showMessage("Login successful! Welcome to BiGGER WIN.", true);

    }

  } catch (error) {
    showMessage(error.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent =
      currentMode === "signup" ? "CREATE ACCOUNT" : "LOGIN";
  }
});

/* FORGOTTEN PASSWORD */

forgotLink.addEventListener("click", async () => {
  const userEmail = email.value.trim();

  if (!userEmail) {
    showMessage("Enter your email address first.");
    email.focus();
    return;
  }

  showMessage("Sending password recovery email...", true);

  try {
    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(userEmail, {
        redirectTo: window.location.origin
      });

    if (error) throw error;

    showMessage(
      "Recovery email sent! Check your inbox and spam folder.",
      true
    );

  } catch (error) {
    showMessage(error.message);
  }
});

/* CHECK SUPABASE CONFIGURATION */

if (
  SUPABASE_URL === "YOUR_SUPABASE_URL" ||
  SUPABASE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
) {
  showMessage("Please enter your Supabase URL and publishable key.");
}

/* BiGGER WIN MOBILE SCREEN FIX */

html {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff !important;
}

.container {
  width: 100%;
  max-width: 480px;
  padding: 28px 22px;
  margin: 0 auto;
  border-radius: 16px;
}

.logo {
  font-size: clamp(26px, 8vw, 36px);
}

input {
  width: 100%;
  min-height: 50px;
  font-size: 16px;
}

.tabs button,
.main-button {
  min-height: 50px;
  font-size: 16px;
}

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  .container {
    max-width: 100%;
    padding: 26px 18px;
  }
  }
  
</script>

</body>
  </html>
