<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#bw-auth {
  max-width: 420px;
  margin: 30px auto;
  padding: 24px;
  background: white;
  color: #111;
  border-radius: 15px;
  font-family: Arial, sans-serif;
  text-align: center;
}

#bw-auth h2 {
  color: #c99a18;
}

#bw-auth input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.bw-field {
  display: flex;
  gap: 6px;
  margin: 10px 0;
}

.bw-field input {
  flex: 1;
  min-width: 0;
}

.bw-eye {
  width: 65px;
  background: #333;
  color: white;
  border: none;
  border-radius: 7px;
}

.bw-action {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  background: #c99a18;
  color: white;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

.bw-action:disabled {
  opacity: 0.6;
}

#bw-message {
  overflow-wrap: anywhere;
}
</style>

<section id="bw-auth">
  <h2>BiGGER WIN</h2>
  <p>Play, Create and Win!</p>

  <h3>Create Account</h3>

  <input id="bw-signup-email"
    type="email" placeholder="Email address"
    autocomplete="email">

  <div class="bw-field">
    <input id="bw-signup-password"
      type="password" placeholder="Create password"
      autocomplete="new-password">
    <button class="bw-eye" type="button"
      data-target="bw-signup-password">Show</button>
  </div>

  <button id="bw-signup-btn" class="bw-action"
    type="button">SIGN UP</button>

  <hr>

  <h3>Welcome Back</h3>

  <input id="bw-login-email"
    type="email" placeholder="Email address"
    autocomplete="username">

  <div class="bw-field">
    <input id="bw-login-password"
      type="password" placeholder="Your password"
      autocomplete="current-password">
    <button class="bw-eye" type="button"
      data-target="bw-login-password">Show</button>
  </div>

  <button id="bw-login-btn" class="bw-action"
    type="button">LOGIN</button>

  <p id="bw-message" role="status"></p>
</section>
