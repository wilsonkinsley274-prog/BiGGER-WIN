<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- BiGGER WIN AUTHENTICATION -->
<style>
#bw-auth {
  max-width: 420px;
  margin: 30px auto;
  padding: 24px;
  background: white;
  color: #111;
  border-radius: 15px;
  font-family: Arial, sans-serif;
  text-align: center;
}

#bw-auth h2 {
  color: #c99a18;
}

#bw-auth input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.bw-field {
  display: flex;
  gap: 6px;
  margin: 10px 0;
}

.bw-field input {
  flex: 1;
  min-width: 0;
}

.bw-eye {
  width: 65px;
  background: #333;
  color: white;
  border: none;
  border-radius: 7px;
}

.bw-action {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  background: #c99a18;
  color: white;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
.bw-action:disabled {
  opacity: 0.6;
#bw-message {
  overflow-wrap: anywhere;
</style>
<section id="bw-auth">
<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
'https://kedrvewjsixadhrchvpu.supabase.co';

const SUPABASE_KEY =
'sb_publishable_kY88vqNjvyYXQ6XjTRU9Bg_VVoOyqMq';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const message = document.getElementById('bw-message');
const signupBtn = document.getElementById('bw-signup-btn');
const loginBtn = document.getElementById('bw-login-btn');
const forgotBtn = document.getElementById('bw-forgot-password');

function showMessage(text) {
    if (message) message.textContent = text;
    else alert(text);
}

// SHOW AND HIDE PASSWORD
document.querySelectorAll('.bw-eye').forEach(button => {
    button.addEventListener('click', () => {
        const field = document.getElementById(button.dataset.target);
        if (!field) return;

        const showing = field.type === 'password';
        field.type = showing ? 'text' : 'password';
        button.textContent = showing ? 'Hide' : 'Show';
    });
});

// SIGN UP
signupBtn.addEventListener('click', async () => {
    const email = document.getElementById('bw-signup-email').value.trim();
    const password = document.getElementById('bw-signup-password').value;

    if (!email || !password) {
        showMessage('Enter your email and password.');
        return;
    }

    if (password.length < 6) {
        showMessage('Password must have at least 6 characters.');
        return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating account...';

    try {
        const { data, error } = await supabase.auth.signUp({
            email,
            password
        });

        if (error) throw error;

        showMessage(
            data.session
            ? 'Account created successfully!'
            : 'Account created! Check your email to confirm registration.'
        );

    } catch (error) {
        showMessage('Sign-up failed: ' + error.message);
    } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'SIGN UP';
    }
});

// LOGIN
loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('bw-login-email').value.trim();
    const password = document.getElementById('bw-login-password').value;

    if (!email || !password) {
        showMessage('Enter your email and password.');
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    try {
        const { error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        showMessage('Welcome to BiGGER WIN! Login successful.');

    } catch (error) {
        showMessage('Login failed: ' + error.message);
    } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'LOGIN';
    }
});

// FORGOT PASSWORD
forgotBtn.addEventListener('click', async () => {
    const email = document.getElementById('bw-login-email').value.trim();

    if (!email) {
        showMessage('Enter your email address first.');
        return;
    }

    forgotBtn.disabled = true;

    try {
        const { error } = await supabase.auth.resetPasswordForEmail(
            email,
            { redirectTo: window.location.origin }
        );

        if (error) throw error;

        showMessage('Password recovery instructions sent. Check your email.');

    } catch (error) {
        showMessage('Recovery failed: ' + error.message);
    } finally {
        forgotBtn.disabled = false;
    }
});

console.log('BiGGER WIN authentication loaded successfully.');
  </script>
