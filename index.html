
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>BiGGER WIN</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: white;
  color: #111;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 25px 15px;
  border-bottom: 1px solid #d6ad45;
}

.logo {
  color: #c69a2e;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle {
  color: #666;
  margin-top: 9px;
  font-size: 14px;
}

main {
  max-width: 440px;
  width: 100%;
  margin: 45px auto;
  padding: 20px;
}

.card {
  background: white;
  border: 1px solid #d6ad45;
  border-radius: 15px;
  padding: 25px 20px;
  box-shadow: 0 4px 18px #0000000d;
}

h1 {
  text-align: center;
  color: #c69a2e;
  margin-bottom: 22px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}

.tabs button {
  flex: 1;
  padding: 13px 5px;
  border: 1px solid #d6ad45;
  background: white;
  color: #a77c19;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.tabs button.active {
  background: #d6ad45;
  color: #111;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  background: white;
  color: #111;
}

.password-box {
  display: flex;
  gap: 7px;
}

.password-box input {
  min-width: 0;
  flex: 1;
}

.show-btn {
  padding: 0 12px;
  background: white;
  color: #a77c19;
  border: 1px solid #d6ad45;
  border-radius: 8px;
  cursor: pointer;
}

.action {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  background: #d6ad45;
  color: #111;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
  cursor: wait;
}

.forgot {
  display: block;
  text-align: right;
  margin-top: 14px;
  color: #a77c19;
  font-size: 14px;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

#message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">BiGGER WIN</div>
  <div class="subtitle">
    Welcome to a world of opportunities
  </div>
</header>

<main>
<div class="card">

<h1 id="formTitle">Welcome Back!</h1>

<div class="tabs">
  <button id="loginTab" class="active" type="button">
    LOGIN
  </button>

  <button id="signupTab" type="button">
    SIGN UP
  </button>
</div>

<form id="authForm">

<div id="nameGroup" class="hidden">
  <label for="fullName">Full Name</label>
  <input id="fullName" type="text"
  placeholder="Enter your full name">
</div>

<label for="email">Email Address</label>
<input id="email" type="email"
placeholder="Enter your email" required>

<label for="password">Password</label>

<div class="password-box">
  <input id="password" type="password"
  placeholder="Enter your password" required>

  <button id="showPassword" class="show-btn"
  type="button">Show</button>
</div>

<div id="forgotGroup">
  <span class="forgot" id="forgotPassword">
    Forgot Password?
  </span>
</div>

<button class="action" id="submitBtn" type="submit">
  LOGIN
</button>

<p id="message" role="status"></p>

</form>
</div>
</main>

<footer>
© 2026 BiGGER WIN. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "
  https://kedrvewjsixadhrchvpu.supabase.co/rest/v1/";
const SUPABASE_KEY = "
  sb_publishable_kY88vqNjvyYXQ6XjTRU9Bg_VVoOyqMq";

const client = window.supabase.createClient(
  
);

const $ = id => document.getElementById(id);

let currentMode = "login";

function setMode(mode) {
  currentMode = mode;

  $("loginTab").classList.toggle("active", mode === "login");
  $("signupTab").classList.toggle("active", mode === "signup");

  $("nameGroup").classList.toggle("hidden", mode !== "signup");
  $("forgotGroup").classList.toggle("hidden", mode !== "login");

  $("fullName").required = mode === "signup";

  $("formTitle").textContent =
    mode === "login" ? "Welcome Back!" : "Create Account";

  $("submitBtn").textContent =
    mode === "login" ? "LOGIN" : "CREATE ACCOUNT";

  $("message").textContent = "";
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));

$("showPassword").addEventListener("click", () => {
  const visible = $("password").type === "password";
  $("password").type = visible ? "text" : "password";
  $("showPassword").textContent = visible ? "Hide" : "Show";
});

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;
  const fullName = $("fullName").value.trim();

  const button = $("submitBtn");
  const message = $("message");

  if (SUPABASE_URL.includes("YOUR_") ||
      SUPABASE_KEY.includes("YOUR_")) {
    message.textContent = "Please configure your Supabase credentials.";
    return;
  }

  button.disabled = true;
  message.textContent = "Please wait...";

  try {
    if (currentMode === "signup") {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName }
        }
      });

      if (error) throw error;

      message.textContent = data.session
        ? "Your BiGGER WIN account has been created!"
        : "Account created! Please verify your email.";
    } else {
      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      message.textContent = "Welcome to BiGGER WIN! Login successful.";
    }
  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

$("forgotPassword").addEventListener("click", async () => {
  const email = $("email").value.trim();

  if (!email) {
    $("message").textContent = "Enter your email address first.";
    return;
  }

  $("message").textContent = "Sending recovery email...";

  const { error } = await client.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });

  $("message").textContent = error
    ? error.message
    : "Recovery email sent. Check your inbox.";
});
</script>

</body>
  </html>
