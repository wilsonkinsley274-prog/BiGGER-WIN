<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>BiGGER WIN</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #111111;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 25px 15px;
  border-bottom: 1px solid #d6ad45;
}

.logo {
  color: #c69a2e;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle {
  color: #666;
  font-size: 14px;
  margin-top: 9px;
}

main {
  max-width: 440px;
  width: 100%;
  margin: 45px auto;
  padding: 20px;
}

.card {
  border: 1px solid #d6ad45;
  border-radius: 15px;
  padding: 25px 20px;
  background: white;
  box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}

h1 {
  text-align: center;
  color: #c69a2e;
  margin-bottom: 20px;
  font-size: 27px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.tabs button {
  flex: 1;
  padding: 13px 5px;
  border: 1px solid #d6ad45;
  background: white;
  color: #a77c19;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.tabs button.active {
  background: #d6ad45;
  color: #111;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  background: white;
  color: #111;
}

.password-box {
  display: flex;
  gap: 7px;
}

.password-box input {
  flex: 1;
  min-width: 0;
}

.show-btn {
  padding: 0 10px;
  border: 1px solid #d6ad45;
  border-radius: 8px;
  background: white;
  color: #a77c19;
  cursor: pointer;
}

.action {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #d6ad45;
  color: #111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.forgot {
  display: block;
  text-align: right;
  margin-top: 14px;
  color: #a77c19;
  font-size: 14px;
  cursor: pointer;
}

.hidden {
  display: none;
}

#message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  color: #a77c19;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}

</style>
</head>
 </script> 
<body>
  <script>
document.addEventListener("DOMContentLoaded", function () {

  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");
  const nameGroup = document.getElementById("nameGroup");

  if (signupTab) {
    signupTab.addEventListener("click", function () {
      if (nameGroup) nameGroup.classList.remove("hidden");
      signupTab.classList.add("active");
      if (loginTab) loginTab.classList.remove("active");
    });
  }

  if (loginTab) {
    loginTab.addEventListener("click", function () {
      if (nameGroup) nameGroup.classList.add("hidden");
      loginTab.classList.add("active");
      if (signupTab) signupTab.classList.remove("active");
    });
  }

});
  </script>
  © 2026 BiGGER WIN. All rights reserved.
</footer>
  
  </script>
  </body>
</html>
